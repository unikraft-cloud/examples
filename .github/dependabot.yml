- package-ecosystem: mix
  directories:
  - /*
  - /*/*
  schedule:
    interval: monthly
  groups:
    mix:
      group-by: dependency-name
      patterns:
      - "*"
  ignore:
  - dependency-name: "*"
    update-types:
    - version-update:semver-major

- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: monthly
  groups:
    github-actions:
      patterns:
      - "*"
