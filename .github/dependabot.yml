version: 2

updates:
- package-ecosystem: docker
  directories:
  - /*
  - /*/*
  schedule:
    interval: monthly
  groups:
    docker:
      group-by: dependency-name
      patterns:
      - "*"
  ignore:
  - dependency-name: "*"
    update-types:
    - version-update:semver-major
    - version-update:semver-minor

- package-ecosystem: npm
  directories:
  - /*
  - /*/*
  schedule:
    interval: monthly
  groups:
    npm:
      group-by: dependency-name
      patterns:
      - "*"
  ignore:
  - dependency-name: "*"
    update-types:
    - version-update:semver-major

- package-ecosystem: pip
  directories:
  - /
  - /*
  - /*/*
  schedule:
    interval: monthly
  groups:
