name: examples/opentelemetry-collector (staging)

on:
  workflow_dispatch:

  push:
    branches: [ main ]
    paths:
    - '.github/workflows/example-opentelemetry-collector-staging.yaml'
    - 'opentelemetry-collector/**'
    - '!opentelemetry-collector/README.md'

  pull_request:
    types: [ opened, synchronize, reopened ]
    branches: [ main ]
    paths:
    - '.github/workflows/example-opentelemetry-collector-staging.yaml'
    - 'opentelemetry-collector/**'
    - '!opentelemetry-collector/README.md'

  schedule:
  - cron: '0 17 * * 1'

# Automatically cancel in-progress actions on the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request_target' && github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  UKC_METRO: "https://api.${{ vars.UKC_METRO_STAGING }}.unikraft.cloud/v1"
  UKC_TOKEN: ${{ secrets.UKC_TOKEN }}
  KRAFTKIT_NO_CHECK_UPDATES: true
  KRAFTKIT_LOG_LEVEL: debug

jobs:
  integration:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Test
      id: test
      uses: unikraft/kraftkit@staging
      with:
        run: |
          set -xe;

          cd opentelemetry-collector;

          kraft cloud deploy \
            --no-start \
            --name opentelemetry-collector-${GITHUB_RUN_ID} \
            --runtime index.unikraft.io/official-staging/base-compat:latest \
            --subdomain opentelemetry-collector-${GITHUB_RUN_ID} \
            -p 443:13133 \
            -M 1536 \
            .;

          # wait for the instance to start
          kraft cloud vm start -w 5s opentelemetry-collector-${GITHUB_RUN_ID};
          sleep 5;

          curl -Lv --fail-with-body --max-time 10 https://opentelemetry-collector-${GITHUB_RUN_ID}.${{ vars.UKC_METRO_STAGING }}.unikraft.app

    - name: Cleanup
      uses: unikraft/kraftkit@staging
      if: always()
      with:
        run: |
          set -xe;

          kraft cloud vm stop opentelemetry-collector-${GITHUB_RUN_ID} || true;
          kraft cloud vm logs opentelemetry-collector-${GITHUB_RUN_ID} || true;
          kraft cloud vm rm opentelemetry-collector-${GITHUB_RUN_ID} || true;
          kraft cloud img rm index.unikraft.io/test/opentelemetry-collector-${GITHUB_RUN_ID} || true;
