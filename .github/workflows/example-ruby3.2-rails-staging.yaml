name: examples/ruby3.2-rails (staging)

on:
  workflow_dispatch:

  push:
    branches: [ main ]
    paths:
    - '.github/workflows/example-ruby3.2-rails-staging.yaml'
    - 'ruby3.2-rails/**'
    - '!ruby3.2-rails/README.md'

  pull_request:
    types: [ opened, synchronize, reopened ]
    branches: [ main ]
    paths:
    - '.github/workflows/example-ruby3.2-rails-staging.yaml'
    - 'ruby3.2-rails/**'
    - '!ruby3.2-rails/README.md'

  schedule:
  - cron: '0 17 * * 1'

# Automatically cancel in-progress actions on the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request_target' && github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  UKC_METRO: "https://api.${{ vars.UKC_METRO_STAGING }}.unikraft.cloud/v1"
  UKC_TOKEN: ${{ secrets.UKC_TOKEN }}
  KRAFTKIT_NO_CHECK_UPDATES: true
  KRAFTKIT_LOG_LEVEL: debug

jobs:
  integration:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Test
      id: test
      uses: unikraft/kraftkit@staging
      with:
        run: |
          set -xe;

          cd ruby3.2-rails;

          kraft cloud deploy \
            --no-start \
            -e GEM_HOME=/usr/local/bundle \
            -e BUNDLE_APP_CONFIG=/usr/local/bundle \
            --name ruby32-rails-staging-${GITHUB_RUN_ID} \
            --runtime index.unikraft.io/official-staging/base-compat:latest \
            --subdomain ruby32-rails-staging-${GITHUB_RUN_ID} \
            -p 443:3000 \
            -M 1Gi \
            .;

          # wait for the instance to start
          kraft cloud vm start -w 5s ruby32-rails-staging-${GITHUB_RUN_ID};
          sleep 5;

          curl -Lv --fail-with-body --max-time 10 https://ruby32-rails-staging-${GITHUB_RUN_ID}.${{ vars.UKC_METRO_STAGING }}.unikraft.app

    - name: Cleanup
      uses: unikraft/kraftkit@staging
      if: always()
      with:
        run: |
          set -xe;

          kraft cloud vm stop ruby32-rails-staging-${GITHUB_RUN_ID} || true;
          kraft cloud vm logs ruby32-rails-staging-${GITHUB_RUN_ID} || true;
          kraft cloud vm rm ruby32-rails-staging-${GITHUB_RUN_ID} || true;
          kraft cloud img rm index.unikraft.io/test/ruby32-rails-staging-${GITHUB_RUN_ID} || true;
