name: test-examples

on:
  workflow_dispatch:
    inputs:
      unikraft_version:
        description: 'Version of the unikraft CLI to install (passed to unikraft/setup-action).'
        required: false
        default: 'latest'
      test_directory:
        description: 'Example directory to test (e.g. "nginx"). "all" runs everything; "all_arm" runs every example whose Kraftfile declares an arm64 target.'
        required: false
        default: 'all'
      arch:
        description: 'Architecture to build the examples for (passed to `unikraft build --arch`). "default" builds the target(s) declared in each Kraftfile.'
        required: false
        type: choice
        default: 'default'
        options:
        - 'default'
        - 'x86_64'
        - 'arm64'
      metro:
        description: 'Metro to deploy into (e.g. "fra", "was", "pdx-fierce-coyote"). Leave empty to use the UKC_METRO_STABLE repository variable.'
        required: false
        default: ''
      metro_endpoint:
        description: 'API endpoint for that metro (e.g. "https://api.pdx-fierce-coyote.unikraft.cloud"). Leave empty to derive it as https://api.<metro>.unikraft.cloud.'
        required: false
        default: ''

  # Run on any change except docs-only updates. `paths-ignore` keeps the
  # maintenance burden low — we don't need to enumerate every example
  # directory, and the concurrency group below cancels superseded runs
  # so cost stays bounded.
  push:
    branches: [ main ]
    paths-ignore:
    - '**/README.md'
    - '**/*.md'
    - 'LICENSE'

  pull_request:
    types: [ opened, synchronize, reopened ]
    branches: [ main ]
    paths-ignore:
    - '**/README.md'
    - '**/*.md'
    - 'LICENSE'

  schedule:
  - cron: '0 16 * * 1'

permissions:
  contents: read

# Automatically cancel in-progress actions on the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request_target' && github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  # The dispatch input wins when given; otherwise (and for every non-dispatch
  # event) fall back to the repository variable.
  UKC_METRO: ${{ inputs.metro || vars.UKC_METRO_STABLE }}
  # Empty means "derive from UKC_METRO". Only needed for metros whose endpoint
  # does not follow the https://api.<metro>.unikraft.cloud pattern.
  UKC_METRO_ENDPOINT: ${{ inputs.metro_endpoint }}
  UKC_TOKEN: ${{ secrets.UKC_TOKEN }}
  UKC_IMAGE_PREFIX: ${{ vars.UKC_IMAGE_PREFIX_STABLE || 'test' }}
  # Empty means "no --arch flag", i.e. build whatever the Kraftfile declares.
  # That covers both the "default" choice and every non-dispatch event, where
  # `inputs` is empty.
  UKC_ARCH: ${{ inputs.arch != 'default' && inputs.arch || '' }}

jobs:
  detect-changes:
    runs-on: ubuntu-24.04-arm
    outputs:
      matrix: ${{ steps.changes.outputs.matrix }}
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Determine changed example directories
      id: changes
      env:
        INPUT_TEST_DIR: ${{ inputs.test_directory }}
      run: |
        # Collect directories into a bash array, then emit as JSON.
        declare -a DIRS=()

        # workflow_dispatch: honour the test_directory input.
        if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
          DIR="$INPUT_TEST_DIR"
          if [[ -z "$DIR" || "$DIR" == "all" ]]; then
            # Run all directories that have a test file.
            for d in */; do
              d="${d%/}"
              if compgen -G "${d}/test_*.py" > /dev/null 2>&1; then
                DIRS+=("$d")
              fi
            done
          elif [[ "$DIR" == "all_arm" ]]; then
            # Every example whose Kraftfile declares an arm64 target. Derived
            # rather than hardcoded, so an example becomes part of "all_arm"
            # the moment it is ported — no edit to this workflow needed.
            for d in */; do
              d="${d%/}"
              compgen -G "${d}/test_*.py" > /dev/null 2>&1 || continue
              # Match both the short-hand target list entry ("- kraftcloud/arm64")
              # and the long-hand form ("arch: arm64"). Recursive so that
              # multi-service examples, whose Kraftfiles sit one level down,
              # are matched too.
              if grep -rqsE '^[[:space:]]*-[[:space:]]*([a-z0-9_]+/)?arm64[[:space:]]*$|^[[:space:]]*arch(itecture)?:[[:space:]]*arm64[[:space:]]*$' \
                   --include=Kraftfile "$d"; then
                DIRS+=("$d")
              fi
            done
            if [[ ${#DIRS[@]} -eq 0 ]]; then
              echo "::error::No examples declare an arm64 target."
              exit 1
            fi
          elif [[ "$DIR" =~ ^[a-zA-Z0-9][a-zA-Z0-9._-]*$ ]] && [[ -d "$DIR" ]]; then
            DIRS+=("$DIR")
          else
            echo "::error::Invalid test_directory input: $DIR"
            exit 1
          fi
        # Always run everything for scheduled runs.
        elif [[ "${{ github.event_name }}" == "schedule" ]]; then
          for d in */; do
            d="${d%/}"
            if compgen -G "${d}/test_*.py" > /dev/null 2>&1; then
              DIRS+=("$d")
            fi
          done
        else
          # For PRs and pushes to main, only test affected examples.
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            HEAD=${{ github.event.pull_request.head.sha }}
            BASE=$(git merge-base "origin/${{ github.event.pull_request.base.ref }}" "$HEAD")
          else
            BASE=${{ github.event.before }}
            HEAD=${{ github.sha }}
          fi

          # On branch creation or certain force-pushes, 'before' is all zeros.
          if [[ "$BASE" == "0000000000000000000000000000000000000000" ]]; then
            echo "Initial push detected — running all tests."
            for d in */; do
              d="${d%/}"
              if compgen -G "${d}/test_*.py" > /dev/null 2>&1; then
                DIRS+=("$d")
              fi
            done
          else
            # Files whose changes should trigger the full test suite.
            INFRA_PATTERN='^(conftest\.py|pytest\.ini|requirements\.txt|_testlib/|\.github/workflows/test-examples\.yaml)'

            CHANGED_FILES=$(git diff --name-only "$BASE" "$HEAD")

            if echo "$CHANGED_FILES" | grep -qE "$INFRA_PATTERN"; then
              for d in */; do
                d="${d%/}"
                if compgen -G "${d}/test_*.py" > /dev/null 2>&1; then
                  DIRS+=("$d")
                fi
              done
            else
              # Collect unique top-level directories that changed and contain a test file.
              for dir in $(echo "$CHANGED_FILES" | cut -d/ -f1 | sort -u); do
                if compgen -G "${dir}/test_*.py" > /dev/null 2>&1; then
                  DIRS+=("$dir")
                fi
              done
            fi
          fi
        fi

        if [[ ${#DIRS[@]} -eq 0 ]]; then
          echo "No example directories with tests to run."
          echo "matrix=" >> "$GITHUB_OUTPUT"
        else
          # Build JSON array for the matrix without relying on jq.
          JSON=$(python3 -c 'import json, sys; print(json.dumps(sys.argv[1:]))' "${DIRS[@]}")
          echo "Matrix: $JSON"
          echo "matrix=$JSON" >> "$GITHUB_OUTPUT"
        fi

  pytest:
    needs: detect-changes
    if: needs.detect-changes.outputs.matrix != ''
    timeout-minutes: 60
    runs-on: ubuntu-24.04-arm

    strategy:
      fail-fast: false
      matrix:
        example: ${{ fromJson(needs.detect-changes.outputs.matrix) }}

    name: pytest (${{ matrix.example }})

    steps:
    - uses: actions/checkout@v5

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'
        cache-dependency-path: requirements.txt

    - name: Install system dependencies
      run: sudo apt-get update && sudo apt-get install -y --no-install-recommends socat lftp

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Install Unikraft CLI
      uses: unikraft/setup-action@main
      with:
        version: ${{ inputs.unikraft_version || 'latest' }}

    - name: Authenticate unikraft CLI
      run: echo $UKC_TOKEN | unikraft login --token -

    - name: Override metros in CLI config
      run: |
        python3 - <<'PY'
        import yaml, os

        config_path = os.path.expanduser('~/.config/unikraft/config.yaml')
        with open(config_path) as f:
            config = yaml.safe_load(f)

        metro = os.environ['UKC_METRO']
        endpoint = os.environ.get('UKC_METRO_ENDPOINT') or f'https://api.{metro}.unikraft.cloud'
        profile = config['profiles'][config['profile']]
        profile['metros'] = [{
            'name': metro,
            'endpoint': endpoint,
        }]
        print(f'metro: {metro}\nendpoint: {endpoint}')

        with open(config_path, 'w') as f:
            yaml.safe_dump(config, f, default_flow_style=False)
        PY

    - name: Run tests
      env:
        UKC_TEST_ID: ${{ github.run_id }}-${{ matrix.example}}-${{ github.run_attempt }}
      run: exec pytest --log-cli-level=INFO "${{ matrix.example }}"

    - name: Cleanup test resources
      if: always()
      env:
        UKC_TEST_ID: ${{ github.run_id }}-${{ matrix.example}}-${{ github.run_attempt }}
      run: bash scripts/cleanup-test-resources.sh
