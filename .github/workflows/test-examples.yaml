name: test-examples

on:
  workflow_dispatch:
    inputs:
      unikraft_version:
        description: 'Version of the unikraft CLI to install (passed to unikraft/setup-action).'
        required: false
        default: 'latest'
      test_directory:
        description: 'Example directory to test (e.g. "nginx"). Leave empty or set to "all" to run everything.'
        required: false
        default: 'all'

  # Run on any change except docs-only updates. `paths-ignore` keeps the
  # maintenance burden low — we don't need to enumerate every example
  # directory, and the concurrency group below cancels superseded runs
  # so cost stays bounded.
  push:
    branches: [ main ]
    paths-ignore:
    - '**/README.md'
    - '**/*.md'
    - 'LICENSE'

  pull_request:
    types: [ opened, synchronize, reopened ]
    branches: [ main ]
    paths-ignore:
    - '**/README.md'
    - '**/*.md'
    - 'LICENSE'

  schedule:
  - cron: '0 16 * * 1'

permissions:
  contents: read

# Automatically cancel in-progress actions on the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request_target' && github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  UKC_METRO: ${{ vars.UKC_METRO_STABLE }}
  UKC_TOKEN: ${{ secrets.UKC_TOKEN }}
  UKC_IMAGE_PREFIX: ${{ vars.UKC_IMAGE_PREFIX_STABLE || 'test' }}

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.changes.outputs.matrix }}
      arm_matrix: ${{ steps.changes.outputs.arm_matrix }}
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Determine changed example directories
      id: changes
      env:
        INPUT_TEST_DIR: ${{ inputs.test_directory }}
      run: |
        # Collect directories into a bash array, then emit as JSON.
        declare -a CANDIDATES=() DIRS=() ARM_DIRS=()
        FORCED=""
        ARM_ALL=0

        all_dirs() {
          for d in */; do
            CANDIDATES+=("${d%/}")
          done
        }

        # workflow_dispatch: honour the test_directory input.
        if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
          DIR="$INPUT_TEST_DIR"
          if [[ -z "$DIR" || "$DIR" == "all" ]]; then
            all_dirs
          elif [[ "$DIR" =~ ^[a-zA-Z0-9][a-zA-Z0-9._-]*$ ]] && [[ -d "$DIR" ]]; then
            CANDIDATES+=("$DIR")
            FORCED="$DIR"
          else
            echo "::error::Invalid test_directory input: $DIR"
            exit 1
          fi
        # Always run everything for scheduled runs.
        elif [[ "${{ github.event_name }}" == "schedule" ]]; then
          all_dirs
        else
          # For PRs and pushes to main, only test affected examples.
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            HEAD=${{ github.event.pull_request.head.sha }}
            BASE=$(git merge-base "origin/${{ github.event.pull_request.base.ref }}" "$HEAD")
          else
            BASE=${{ github.event.before }}
            HEAD=${{ github.sha }}
          fi

          # On branch creation or certain force-pushes, 'before' is all zeros.
          if [[ "$BASE" == "0000000000000000000000000000000000000000" ]]; then
            echo "Initial push detected — running all tests."
            all_dirs
          else
            # Files whose changes should trigger the full test suite.
            INFRA_PATTERN='^(conftest\.py|pytest\.ini|requirements\.txt|_testlib/|\.github/workflows/test-examples\.yaml)'

            CHANGED_FILES=$(git diff --name-only "$BASE" "$HEAD")

            if echo "$CHANGED_FILES" | grep -qE '^scripts/(build-example|kraftfile-targets)\.sh$'; then
              ARM_ALL=1
            fi

            if echo "$CHANGED_FILES" | grep -qE "$INFRA_PATTERN"; then
              all_dirs
            else
              for dir in $(echo "$CHANGED_FILES" | cut -d/ -f1 | sort -u); do
                if [[ -d "$dir" ]]; then
                  CANDIDATES+=("$dir")
                fi
              done
            fi
          fi
        fi

        for d in "${CANDIDATES[@]}"; do
          if [[ "$d" == "$FORCED" ]] || compgen -G "${d}/test_*.py" > /dev/null 2>&1; then
            DIRS+=("$d")
          fi
        done

        if [[ $ARM_ALL -eq 1 ]]; then
          CANDIDATES=()
          all_dirs
        fi
        for d in "${CANDIDATES[@]}"; do
          if find "$d" -maxdepth 2 -name Kraftfile -exec scripts/kraftfile-targets.sh {} arm64 \; -print | grep -q .; then
            ARM_DIRS+=("$d")
          fi
        done

        emit() {
          local name=$1
          shift
          if [[ $# -eq 0 ]]; then
            echo "${name}=" >> "$GITHUB_OUTPUT"
          else
            local json
            json=$(python3 -c 'import json, sys; print(json.dumps(sys.argv[1:]))' "$@")
            echo "${name}: ${json}"
            echo "${name}=${json}" >> "$GITHUB_OUTPUT"
          fi
        }

        emit matrix "${DIRS[@]}"
        emit arm_matrix "${ARM_DIRS[@]}"

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5

    - name: Check multi-architecture examples
      run: bash scripts/lint-multiarch.sh

  pytest:
    needs: detect-changes
    if: needs.detect-changes.outputs.matrix != ''
    timeout-minutes: 60
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        example: ${{ fromJson(needs.detect-changes.outputs.matrix) }}

    name: pytest (${{ matrix.example }})

    steps:
    - uses: actions/checkout@v5

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'
        cache-dependency-path: requirements.txt

    - name: Install system dependencies
      run: sudo apt-get update && sudo apt-get install -y --no-install-recommends socat lftp

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Install Unikraft CLI
      uses: unikraft/setup-action@main
      with:
        version: ${{ inputs.unikraft_version || 'latest' }}

    - name: Authenticate unikraft CLI
      run: echo "$UKC_TOKEN" | unikraft login --token -

    - name: Override metros in CLI config
      run: |
        python3 - <<'PY'
        import yaml, os

        config_path = os.path.expanduser('~/.config/unikraft/config.yaml')
        with open(config_path) as f:
            config = yaml.safe_load(f)

        metro = os.environ['UKC_METRO']
        profile = config['profiles'][config['profile']]
        profile['metros'] = [{
            'name': metro,
            'endpoint': f'https://api.{metro}.unikraft.cloud',
        }]

        with open(config_path, 'w') as f:
            yaml.safe_dump(config, f, default_flow_style=False)
        PY

    - name: Run tests
      env:
        UKC_TEST_ID: ${{ github.run_id }}-${{ matrix.example}}-${{ github.run_attempt }}
        UKC_ARCH: x86_64
      run: exec pytest --log-cli-level=INFO "${{ matrix.example }}"

    - name: Cleanup test resources
      if: always()
      env:
        UKC_TEST_ID: ${{ github.run_id }}-${{ matrix.example}}-${{ github.run_attempt }}
      run: bash scripts/cleanup-test-resources.sh

  build-arm64:
    needs: detect-changes
    if: needs.detect-changes.outputs.arm_matrix != ''
    timeout-minutes: 60
    runs-on: ubuntu-24.04-arm

    strategy:
      fail-fast: false
      matrix:
        example: ${{ fromJson(needs.detect-changes.outputs.arm_matrix) }}

    name: build-arm64 (${{ matrix.example }})

    steps:
    - uses: actions/checkout@v5

    - name: Install Unikraft CLI
      uses: unikraft/setup-action@main
      with:
        version: ${{ inputs.unikraft_version || 'latest' }}

    - name: Build
      env:
        EXAMPLE: ${{ matrix.example }}
      run: bash scripts/build-example.sh "$EXAMPLE" arm64
