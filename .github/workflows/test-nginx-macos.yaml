name: test-nginx-macos

on:
  workflow_dispatch:
    inputs:
      unikraft_version:
        description: 'Version of the unikraft CLI to install (passed to unikraft/setup-action).'
        required: false
        default: 'latest'

  push:
    branches: [ main ]
    paths:
    - 'nginx/**'
    - 'conftest.py'
    - 'pytest.ini'
    - 'requirements.txt'
    - '_testlib/**'
    - '.github/workflows/test-nginx-macos.yaml'

  pull_request:
    types: [ opened, synchronize, reopened ]
    branches: [ main ]
    paths:
    - 'nginx/**'
    - 'conftest.py'
    - 'pytest.ini'
    - 'requirements.txt'
    - '_testlib/**'
    - '.github/workflows/test-nginx-macos.yaml'

  schedule:
  - cron: '0 16 * * 1-5'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  UKC_METRO: ${{ vars.UKC_METRO_STABLE }}
  UKC_TOKEN: ${{ secrets.UKC_TOKEN }}
  UKC_IMAGE_PREFIX: ${{ vars.UKC_IMAGE_PREFIX_STABLE || 'test' }}

jobs:
  pytest:
    name: pytest (nginx, macos)
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
    - uses: actions/checkout@v5

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'
        cache-dependency-path: requirements.txt

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Install Unikraft CLI
      uses: unikraft/setup-action@v1
      with:
        version: ${{ inputs.unikraft_version || 'latest' }}

    - name: Authenticate unikraft CLI
      run: echo $UKC_TOKEN | unikraft login --token -

    - name: Override metros in CLI config
      run: |
        python3 - <<'PY'
        import yaml, os

        config_path = os.path.expanduser('~/.config/unikraft/config.yaml')
        with open(config_path) as f:
            config = yaml.safe_load(f)

        metro = os.environ['UKC_METRO']
        profile = config['profiles'][config['profile']]
        profile['metros'] = [{
            'name': metro,
            'endpoint': f'https://api.{metro}.unikraft.cloud',
        }]

        with open(config_path, 'w') as f:
            yaml.safe_dump(config, f, default_flow_style=False)
        PY

    - name: Run nginx test
      run: pytest --log-cli-level=INFO nginx
