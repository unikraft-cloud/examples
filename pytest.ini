[pytest]
addopts = -ra -v --import-mode=importlib -n 64
python_files = test_*.py
pythonpath = .
# Use importlib so test files under different example directories do not
# clash via sys.path-based imports (no __init__.py needed next to tests).
# Also skip example-local build artefacts that pytest would otherwise scan.
norecursedirs = .* _testlib node_modules target build dist .venv venv __pycache__ rootfs .unikraft
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(name)s: %(message)s
